# Netlify build configuration for Novaterra (Next.js 14 + Prisma + Supabase).

[build]
  # Generate Prisma client (Linux engine via binaryTargets) then build Next.
  command   = "prisma generate && next build"
  publish   = ".next"

[build.environment]
  NODE_VERSION              = "20"
  HUSKY                     = "0"
  PRISMA_HIDE_UPDATE_MESSAGE = "true"
  # Tell Netlify to install dependencies even though node_modules may be
  # present in the upload (safety net for the MCP zip-deploy path).
  NPM_FLAGS                 = "--include=dev"

# Force-load the Next.js plugin so SSR + API routes become serverless
# functions. (Netlify normally auto-installs this when it detects Next.js;
# declaring it explicitly is the safety belt for non-Git deploy paths.)
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    X-Frame-Options        = "SAMEORIGIN"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
