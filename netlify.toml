# Netlify build configuration for Novaterra (Next.js 14 + Prisma + Supabase).
# The @netlify/plugin-nextjs is auto-installed by Netlify when it detects a
# Next.js project, so it doesn't need to be declared here.

[build]
  # Generate Prisma client (Linux engine via binaryTargets) then build Next.
  command   = "prisma generate && next build"
  publish   = ".next"

[build.environment]
  # Pin Node so Prisma + Next builds are reproducible.
  NODE_VERSION = "20"
  # Skip Husky / postinstall hooks that don't belong in CI.
  HUSKY = "0"
  # Ensure Prisma uses the binary it generates rather than re-downloading.
  PRISMA_HIDE_UPDATE_MESSAGE = "true"

# Long-cache the Next.js static asset bundle (immutable, hashed filenames).
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Small security baseline — safe defaults, can be tightened per page later.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    X-Frame-Options        = "SAMEORIGIN"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
